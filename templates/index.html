<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>虚拟交换机实验台 · 首页</title>
<style>
  :root { --bg:#0f1420; --card:#1a2233; --line:#2a3550; --fg:#dfe6f3;
          --dim:#8b97b0; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --acc:#60a5fa; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 "Segoe UI",system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px;
           background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; }
  header .sub, .sub { color:var(--dim); }
  main { padding:20px; max-width:980px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line);
          border-radius:10px; padding:16px 18px; }
  .card h2 { font-size:15px; margin:0 0 12px; }
  button { background:var(--acc); color:#0b1020; border:0; border-radius:6px;
           padding:7px 16px; cursor:pointer; font-weight:600; }
  button:disabled { background:#2a3550; color:var(--dim); cursor:not-allowed; }
  button.ghost { background:#2a3550; color:var(--fg); padding:3px 10px; font-weight:500; }
  button:hover:not(:disabled) { filter:brightness(1.1); }
  .msg { margin-top:10px; font-size:13px; min-height:18px; }
  .msg.err { color:var(--bad); } .msg.ok { color:var(--ok); }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  td, th { border:1px solid var(--line); padding:6px 10px; text-align:left; }
  th { color:var(--dim); font-weight:600; }
  .mono { font-family:ui-monospace,Consolas,monospace; }
  .pill { font-size:12px; padding:2px 10px; border-radius:99px; background:#134e2a; color:var(--ok); }
  .pill.full { background:#4a3413; color:var(--warn); }
  a { color:var(--acc); }
  .hint { font-size:12px; color:var(--dim); margin-top:10px; line-height:1.7; }
  .count { font-size:22px; font-weight:700; }
  .flex { display:flex; gap:24px; align-items:center; flex-wrap:wrap; }
</style>
</head>
<body>
<header>
  <h1>五端口虚拟交换机实验台</h1>
  <span class="sub">多组共用 · 每组一台独立交换机 · 组员用同一链接进入</span>
</header>
<main>
  <section class="card">
    <h2>开新练习台</h2>
    <div class="flex">
      <button id="createBtn">新开练习台</button>
      <div>在役台 <span class="count" id="activeCount">-</span>
        <span class="sub">/ 最多 <span id="maxCount">-</span> 台</span>
        <span id="capPill" class="pill">有名额</span>
      </div>
    </div>
    <div class="msg" id="msg"></div>
    <div class="hint">
      每台从空白的五端口交换机开始，各自维护 VLAN、MAC 表与积压，复位只作用于本台。<br>
      开台或上一次写操作成功结束后，空闲满 <span id="timeoutHint">5</span> 分钟即自动回收；
      页面刷新只查看、不续期。台回收后旧链接会收到「已回收」提示，不能操作新台。
    </div>
  </section>

  <section class="card">
    <h2>在役实验台（组员直接打开链接即可进入同一台）</h2>
    <table>
      <thead><tr><th>台</th><th>进入链接</th><th>开台时间</th><th>已空闲</th><th>在途写</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="6" class="sub">加载中…</td></tr></tbody>
    </table>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
function flash(text, ok) {
  const m = $("msg"); m.textContent = text || "";
  m.className = "msg " + (ok ? "ok" : "err");
}
function mmss(sec) {
  sec = Math.max(0, sec);
  return String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
}

async function createBench() {
  flash("", true);
  $("createBtn").disabled = true;
  try {
    const r = await fetch("/api/benches", {method: "POST"});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { flash(j.error || ("HTTP " + r.status), false); $("createBtn").disabled = false; return; }
    window.location.href = j.url;                 // 开台人直接进入
  } catch (e) {
    flash("开台失败：" + e.message, false);
    $("createBtn").disabled = false;
  }
}

async function refresh() {
  let st;
  try { st = await (await fetch("/api/benches")).json(); }
  catch (e) { return; }                           // 网络抖动，下一轮再试
  $("activeCount").textContent = st.active_count;
  $("maxCount").textContent = st.max_benches;
  $("timeoutHint").textContent =
    st.idle_timeout >= 60 ? Math.round(st.idle_timeout / 60) + " 分钟"
                          : st.idle_timeout + " 秒";
  const full = st.active_count >= st.max_benches;
  const pill = $("capPill");
  pill.textContent = full ? "已满额" : "有名额";
  pill.className = "pill" + (full ? " full" : "");
  $("createBtn").disabled = full;
  if (full) flash("实验台已满（最多 " + st.max_benches + " 台），等某台空闲回收、名额腾出后即可另开新台", false);

  const tb = $("rows"); tb.textContent = "";
  if (!st.benches.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td"); td.colSpan = 6;
    td.className = "sub"; td.textContent = "当前无在役台";
    tr.appendChild(td); tb.appendChild(tr);
    return;
  }
  st.benches.forEach((b, idx) => {
    const tr = document.createElement("tr");
    const td1 = document.createElement("td"); td1.textContent = "台 " + (idx + 1);
    const td2 = document.createElement("td");
    const a = document.createElement("a");
    a.href = "/bench/" + b.token; a.className = "mono";
    a.textContent = location.origin + "/bench/" + b.token;
    td2.appendChild(a);
    const copy = document.createElement("button");
    copy.className = "ghost"; copy.textContent = "复制";
    copy.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(a.textContent); };
    td2.appendChild(document.createTextNode(" ")); td2.appendChild(copy);
    const td3 = document.createElement("td"); td3.className = "mono"; td3.textContent = b.created_at;
    const td4 = document.createElement("td");
    const left = st.idle_timeout - b.idle_seconds;
    td4.textContent = mmss(b.idle_seconds) + "（剩 " + mmss(left) + " 回收）";
    const td5 = document.createElement("td"); td5.textContent = b.inflight;
    const td6 = document.createElement("td");
    const enter = document.createElement("button");
    enter.className = "ghost"; enter.textContent = "进入";
    enter.onclick = () => { window.location.href = "/bench/" + b.token; };
    td6.appendChild(enter);
    [td1, td2, td3, td4, td5, td6].forEach(td => tr.appendChild(td));
    tb.appendChild(tr);
  });
}

$("createBtn").onclick = createBench;
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
